# The workerd lane's deployment shape (docs/testing/workerd.md): the same
# module directory and module rules the real deployment uses, against
# workerd's local R2 emulation. The compatibility date trails the newest
# workerd in the devshell, and raising it is a deliberate lane decision.
name = "cachet-worker-lane"
compatibility_date = "2026-05-01"
main = "../crates/cachet-worker/build/index.js"
rules = [
  { type = "CompiledWasm", globs = ["**/*.wasm"], fallthrough = true },
]

[[r2_buckets]]
binding = "CACHE_BUCKET"
bucket_name = "cachet-lane"

# Verdicts, sessions, and OAuth state live in KV; the lane namespace is
# local-emulated, so the id is a label rather than an account resource.
[[kv_namespaces]]
binding = "CACHET_KV"
id = "cachet-lane"

# The lane deployment's auth configuration: a fixed org, audience, and
# branch; CACHET_JWKS_URL and CACHET_GITHUB_API_URL join per run via
# `wrangler dev --var`, pointing at the driver's stub services (the URLs
# are transport configuration; the keys authenticate the tokens, not the
# address they came from).
[vars]
CACHET_ORGS = "lane-org"
CACHET_AUDIENCE = "cachet-lane"
CACHET_DEFAULT_BRANCH_REF = "refs/heads/main"
CACHET_HOST = "cachet.lane.invalid"
CACHET_OAUTH_CLIENT_ID = "lane-oauth-client"
# The laptop token's user is the lane's admin; a second member token
# exercises forbidden_admin.
CACHET_ADMINS = "lane-dev"
# The OAuth web endpoints join per run via --var, like the API URL. Where
# a successful callback lands is not configuration: it is this
# deployment's own console, addressed from CACHET_HOST.
# The collector runs armed with grace zeroed: the lane's seeded objects
# are seconds old and must still be sweepable.
CACHET_GC_GRACE_MS = "0"
# The counter route's account and dataset. The token is a secret and
# enters through .dev.vars, so a scenario without that file exercises the
# "counts but cannot report" answer and one with it exercises the query.
CLOUDFLARE_ACCOUNT_ID = "lane-account"
CACHET_STATS_DATASET = "cachet_lane"
# The console header's own inputs: the deployment's name, and the cron it
# counts down to. The lane's cron below is the same expression, so the
# countdown the health route answers is the schedule that fires.
CACHET_DEPLOY_NAME = "cachet-lane"
CACHET_GC_CRON = "0 5 * * *"

# The console's asset directory is deliberately absent here. Binding it
# makes miniflare put Cloudflare's asset router in front of this worker,
# and that router has no scheduled handler, so the collector's dev
# endpoint answers "exception" instead of running. The console scenario
# boots against a generated copy of this file with the block appended
# (workerd/check.mjs); every other scenario needs the collector more than
# it needs the console.

# Every counted thing is written here. The binding is what moves
# stats::emit off its early return, so the blob and double marshalling
# runs in every scenario rather than only in unit tests; workerd discards
# the points, which is all the lane needs from the write half.
[[analytics_engine_datasets]]
binding = "CACHET_EVENTS"
dataset = "cachet_lane"

# The deployment's collector binding; the lane invokes the scheduled
# handler directly over its dev endpoint.
[triggers]
crons = ["0 5 * * *"]
