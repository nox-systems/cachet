openapi: 3.1.0
info:
  title: cachet
  description: A self-hostable nix binary cache on Cloudflare Workers. Writes carry GitHub OIDC credentials; reads carry a credential this deployment issued, a CI job's OIDC token, or the browser session cookie; the public handshake route is unauthenticated. Every route that reads a credential can additionally answer 400 with code=malformed_auth when the Authorization header itself is undecodable.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  version: 0.1.0
paths:
  /_auth/callback:
    get:
      tags:
      - routes
      summary: |-
        `GET /_auth/callback`: consume the state, exchange the code, gate on
        org membership, and set the session cookie. The state is single-use:
        it is deleted before its validity is judged.
      operationId: auth_callback
      responses:
        '204':
          description: 'Logged in; Set-Cookie: the session (no UI origin configured)'
        '302':
          description: 'Logged in; Location: the configured UI origin, Set-Cookie: the session'
        '400':
          description: problem+json; code=malformed_oauth
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '401':
          description: problem+json; code=oauth_state_unknown or unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '403':
          description: problem+json; code=forbidden_org
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '503':
          description: problem+json; code=auth_unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
  /_auth/login:
    get:
      tags:
      - routes
      summary: |-
        `GET /_auth/login`: begin the browser flow. Redirects to GitHub with
        the state stored in KV for ten minutes.
      operationId: auth_login
      responses:
        '302':
          description: 'Location: the GitHub authorize URL; cache-control no-store'
        '503':
          description: problem+json; code=auth_unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
  /api/login/exchange:
    post:
      tags:
      - routes
      summary: |-
        `POST /api/login/exchange`: trade a GitHub identity for this
        deployment's own read credential. The GitHub token is checked for org
        membership once, here, and neither side keeps it: what the caller
        keeps is the answer's token, which is what the nix daemon carries
        afterwards (ADR 0002). The deployment stores only the token's
        SHA-256.
      operationId: login_exchange
      responses:
        '200':
          description: The issued credential, its holder, and its expiry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadTokenIssued'
        '401':
          description: problem+json; code=unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '403':
          description: problem+json; code=forbidden_org
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '503':
          description: problem+json; code=auth_unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
  /api/login/revoke:
    post:
      tags:
      - routes
      summary: |-
        `POST /api/login/revoke`: forget the presented credential. The holder
        proves they hold it by presenting it, and nobody else can name the
        record, because it is keyed by the token's own hash.
      operationId: login_revoke
      responses:
        '204':
          description: Forgotten; the credential no longer authenticates
        '401':
          description: problem+json; code=unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '503':
          description: problem+json; code=auth_unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
  /api/openapi.json:
    get:
      tags:
      - routes
      summary: |-
        `GET /api/openapi.json`: this document, served as the committed yaml
        so the served bytes are the drift-checked bytes.
      operationId: openapi_get
      responses:
        '200':
          description: The generated OpenAPI document, byte-identical to the committed docs/openapi.yaml
          content:
            application/yaml: {}
  /api/probe:
    post:
      tags:
      - routes
      summary: |-
        `POST /api/probe`: which of the named store-path hashes the cache
        holds. One authorized request per run replaces the per-path narinfo
        HEADs a push would otherwise price one round trip at a time; the
        worker answers from a bucket enumeration, so the answer is bucket
        truth rather than a secondary index's claim. Requires a read
        credential.
      operationId: probe_post
      requestBody:
        description: The store-path hashes to ask about, capped at the push pipeline's closure cap
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProbeBody'
        required: true
      responses:
        '200':
          description: The hashes with a narinfo stored, ascending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeAnswer'
        '400':
          description: problem+json; code=malformed_probe
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '401':
          description: problem+json; code=unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '403':
          description: problem+json; code=forbidden_org
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '411':
          description: problem+json; code=length_required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '413':
          description: problem+json; code=body_too_large
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '503':
          description: problem+json; code=auth_unavailable or storage_unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
  /api/public/config:
    get:
      tags:
      - routes
      summary: |-
        `GET /api/public/config`: discovery for the CLI and the browser flow.
        Unauthenticated and uncacheable.
      operationId: public_config_get
      responses:
        '200':
          description: The deployment's public configuration; cache-control no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicConfig'
        '503':
          description: problem+json; code=auth_unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
  /api/self/events:
    get:
      tags:
      - routes
      summary: '`GET /api/self/events`: the deployment''s own counters, grouped.'
      description: |-
        The caller chooses a question rather than composing one: `subject` is
        one of `reads`, `writes`, `probes`; `by` names a dimension the
        writers fill or a time bucket; `window` is `day`, `week`, or `month`;
        and `kind`, `outcome`, and `actor` narrow the answer to one value
        each. Anything else is refused, including a bucket finer than its
        window can hold. The worker builds the SQL from those choices and
        runs it against Cloudflare with a token scoped to reading analytics
        and nothing else, so no caller text reaches a statement. Requires an
        admin credential.

        Grouping by `hour` or `day` answers a series: one row per bucket,
        oldest first, zeros included, each row's `dimension` the bucket's
        first instant in epoch seconds. Grouping by anything else answers a
        dimension list, largest first.
      operationId: stats_events
      parameters:
      - name: subject
        in: query
        description: reads | writes | probes
        required: true
        schema:
          type: string
      - name: by
        in: query
        description: kind | outcome | actor | repository | reference | hour | day; outcome when unstated
        required: false
        schema:
          type: string
      - name: window
        in: query
        description: day | week | month; day when unstated
        required: false
        schema:
          type: string
      - name: kind
        in: query
        description: narinfo | nar | part | begin | complete | abort | probe | unknown
        required: false
        schema:
          type: string
      - name: outcome
        in: query
        description: edge_hit | bucket_hit | miss | stored | answered | an HTTP status
        required: false
        schema:
          type: string
      - name: actor
        in: query
        description: ci | laptop | browser | anonymous
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 'The totals: largest first, or oldest first when grouped by time'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsEvents'
        '400':
          description: problem+json; code=malformed_query
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '401':
          description: problem+json; code=unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '403':
          description: problem+json; code=forbidden_admin
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '503':
          description: problem+json; code=storage_unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
  /api/self/gc-runs:
    get:
      tags:
      - routes
      summary: |-
        `GET /api/self/gc-runs`: one page of run ids, oldest first. Admins
        only: the login from the read credential must enter CACHET_ADMINS.
      operationId: gc_runs_list
      parameters:
      - name: cursor
        in: query
        description: The nextCursor from the previous page
        required: false
        schema:
          type: string
      responses:
        '200':
          description: The run ids, oldest first; cache-control no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GcRunList'
        '401':
          description: problem+json; code=unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '403':
          description: problem+json; code=forbidden_admin
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '503':
          description: problem+json; code=auth_unavailable or storage_unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
  /api/self/gc-runs/{runId}:
    get:
      tags:
      - routes
      summary: '`GET /api/self/gc-runs/{runId}`: one run''s full report, as stored.'
      operationId: gc_run_get
      parameters:
      - name: runId
        in: path
        description: 'The run id: milliseconds, a dash, sixteen lowercase hex characters'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The run's report document; cache-control no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GcReportBody'
        '400':
          description: problem+json; code=malformed_key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '401':
          description: problem+json; code=unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '403':
          description: problem+json; code=forbidden_admin
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '404':
          description: problem+json; code=not_found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '503':
          description: problem+json; code=auth_unavailable or storage_unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
  /api/self/stats:
    get:
      tags:
      - routes
      summary: |-
        `GET /api/self/stats`: the cache's current shape, derived from the
        newest completed report.
      operationId: stats_get
      responses:
        '200':
          description: The totals from the newest report; cache-control no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsBody'
        '401':
          description: problem+json; code=unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '403':
          description: problem+json; code=forbidden_admin
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '404':
          description: problem+json; code=not_found when no run has completed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '503':
          description: problem+json; code=auth_unavailable or storage_unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
  /api/whoami:
    get:
      tags:
      - routes
      summary: '`GET /api/whoami`: who this request authenticates as.'
      description: |-
        The one identity route outside `/api/self`, because it has to answer
        for an org member who is not an admin: a console that could only
        learn its own standing from a 403 would have to provoke one to render
        its first screen. Any read credential resolves here.
      operationId: whoami
      responses:
        '200':
          description: The caller's login and standing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhoAmI'
        '400':
          description: problem+json; code=malformed_auth
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '401':
          description: problem+json; code=unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
  /logout:
    post:
      tags:
      - routes
      summary: '`POST /logout`: delete the session and expire the cookie. Idempotent.'
      operationId: auth_logout
      responses:
        '204':
          description: Set-Cookie expires the session cookie; cache-control no-store
  /nar/{key}:
    get:
      tags:
      - routes
      summary: |-
        `GET /nar/{key}`: one NAR, edge-cached for 30 days, byte-immutable.
        Requires a read credential: a GitHub token as Bearer (or Basic
        password, which is what nix's netrc support sends), an OIDC token
        (which is what CI runners carry), or the browser session cookie.
      operationId: nar_get
      parameters:
      - name: key
        in: path
        description: 'The NAR object key: the 52-character sha256 nix base32 with an optional compression suffix'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The NAR bytes
          content:
            application/x-nix-nar: {}
        '400':
          description: problem+json; code=malformed_key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '401':
          description: problem+json; code=unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '404':
          description: problem+json; code=not_found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '503':
          description: problem+json; code=auth_unavailable or storage_unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
    put:
      tags:
      - routes
      summary: |-
        `PUT /nar/{key}`: a whole NAR in one request, up to the single-PUT
        cap. Larger uploads use the multipart quartet below.
      operationId: nar_put
      parameters:
      - name: key
        in: path
        description: 'The NAR object key: sha256 nix base32 with an optional compression suffix'
        required: true
        schema:
          type: string
      requestBody:
        description: The NAR bytes; the key names their sha256, so the content is self-addressing
        content:
          application/x-nix-nar:
            schema:
              type: string
        required: true
      responses:
        '204':
          description: Stored
        '400':
          description: problem+json; code=malformed_key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '401':
          description: problem+json; code=unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '403':
          description: problem+json; code=forbidden_org
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '411':
          description: problem+json; code=length_required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '413':
          description: problem+json; code=body_too_large
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '503':
          description: problem+json; code=auth_unavailable or storage_unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
    post:
      tags:
      - routes
      summary: |-
        `POST /nar/{key}?uploads`: begin a multipart upload. The
        `x-cachet-upload-bytes` header declares the total size and binds the
        upload's part plan.
      operationId: upload_create
      parameters:
      - name: key
        in: path
        description: The NAR object key
        required: true
        schema:
          type: string
      - name: uploads
        in: query
        description: Creates a multipart upload
        required: true
        schema:
          type: boolean
      - name: x-cachet-upload-bytes
        in: header
        description: The declared total size in bytes
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The upload id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadCreated'
        '400':
          description: problem+json; code=malformed_key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '401':
          description: problem+json; code=unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '403':
          description: problem+json; code=forbidden_org
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '411':
          description: problem+json; code=length_required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '413':
          description: problem+json; code=body_too_large
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '503':
          description: problem+json; code=auth_unavailable or storage_unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
    delete:
      tags:
      - routes
      summary: |-
        `DELETE /nar/{key}?uploadId`: abandon an upload and let the storage
        reclaim its parts.
      operationId: upload_abort
      parameters:
      - name: key
        in: path
        description: The NAR object key
        required: true
        schema:
          type: string
      - name: uploadId
        in: query
        description: The upload to abort
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Aborted
        '400':
          description: problem+json; code=malformed_key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '401':
          description: problem+json; code=unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '403':
          description: problem+json; code=forbidden_org
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '404':
          description: problem+json; code=upload_unknown
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '503':
          description: problem+json; code=auth_unavailable or storage_unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
    head:
      tags:
      - routes
      summary: '`HEAD /nar/{key}`: metadata only; bypasses the edge cache.'
      operationId: nar_head
      parameters:
      - name: key
        in: path
        description: The NAR object key
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The GET's headers without the body
        '400':
          description: problem+json; code=malformed_key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '401':
          description: problem+json; code=unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '404':
          description: problem+json; code=not_found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
  /nix-cache-info:
    get:
      tags:
      - routes
      summary: |-
        `GET /nix-cache-info`: the nix handshake. Immutable per deployment
        generation; always 200 because it describes configuration, not data.
      operationId: cache_info_get
      responses:
        '200':
          description: StoreDir, WantMassQuery, and Priority, content-type text/x-nix-cache-info
          content:
            text/x-nix-cache-info: {}
    head:
      tags:
      - routes
      summary: '`HEAD /nix-cache-info`: header parity with the GET.'
      operationId: cache_info_head
      responses:
        '200':
          description: The GET's headers without the body
  /roots:
    get:
      tags:
      - routes
      summary: '`GET /roots`: the projects holding leases. Requires a read credential.'
      operationId: projects_list
      responses:
        '200':
          description: The leased projects; cache-control no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
        '401':
          description: problem+json; code=unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '503':
          description: problem+json; code=auth_unavailable or storage_unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
  /roots/{project}:
    get:
      tags:
      - routes
      summary: |-
        `GET /roots/{project}`: one lease document as it was renewed. Requires
        a read credential.
      operationId: lease_get
      parameters:
      - name: project
        in: path
        description: The hyphenated owner-repo project name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The lease document the renewal stored; cache-control no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaseBody'
        '400':
          description: problem+json; code=malformed_key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '401':
          description: problem+json; code=unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '404':
          description: problem+json; code=not_found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '503':
          description: problem+json; code=auth_unavailable or storage_unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
    post:
      tags:
      - routes
      summary: |-
        `POST /roots/{project}`: renew a lease. Claims (ref, repository, run,
        commit) come from the verified OIDC token, never from the body, and
        the project must be the token's own repository.
      operationId: lease_renew
      parameters:
      - name: project
        in: path
        description: The hyphenated owner-repo project name
        required: true
        schema:
          type: string
      requestBody:
        description: The store paths to keep and the installables that produced them
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenewalBody'
        required: true
      responses:
        '204':
          description: The lease renewed
        '400':
          description: problem+json; code=malformed_key or malformed_roots
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '401':
          description: problem+json; code=unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '403':
          description: problem+json; code=forbidden_org, forbidden_ref, or forbidden_project
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '411':
          description: problem+json; code=length_required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '413':
          description: problem+json; code=body_too_large
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '503':
          description: problem+json; code=auth_unavailable or storage_unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
  /{hash}.narinfo:
    get:
      tags:
      - routes
      summary: |-
        `GET /{hash}.narinfo`: one narinfo document, edge-cached for 30 days
        and byte-immutable. Reads authenticate like every cache read; the
        narinfo's signatures are the content-integrity check, not the gate.
      operationId: narinfo_get
      parameters:
      - name: hash
        in: path
        description: The 32-character nix base32 store-path hash
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The signed narinfo
          content:
            text/x-nix-narinfo: {}
        '400':
          description: problem+json; code=malformed_key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '404':
          description: problem+json; code=not_found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
    put:
      tags:
      - routes
      summary: |-
        `PUT /{hash}.narinfo`: the verify-then-sign pipeline. The stored NAR
        is re-hashed compressed and decompressed before anything is signed.
      operationId: narinfo_put
      parameters:
      - name: hash
        in: path
        description: The 32-character nix base32 store-path hash
        required: true
        schema:
          type: string
      requestBody:
        description: The narinfo, as nix wrote it; unsigned or client-signed
        content:
          text/x-nix-narinfo:
            schema:
              type: string
        required: true
      responses:
        '204':
          description: Stored, signed with the deployment key
        '400':
          description: problem+json; code=malformed_key, malformed_narinfo, store_path_mismatch, unsupported_compression, nar_hash_mismatch, or file_hash_mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '401':
          description: problem+json; code=unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '403':
          description: problem+json; code=forbidden_org
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '409':
          description: problem+json; code=narinfo_nar_missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '411':
          description: problem+json; code=length_required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '413':
          description: problem+json; code=body_too_large
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '503':
          description: problem+json; code=auth_unavailable or storage_unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
    head:
      tags:
      - routes
      summary: |-
        `HEAD /{hash}.narinfo`: metadata only; bypasses the edge cache so a
        client can ask what is really stored without evicting anything.
      operationId: narinfo_head
      parameters:
      - name: hash
        in: path
        description: The 32-character nix base32 store-path hash
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The GET's headers without the body
        '400':
          description: problem+json; code=malformed_key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
        '404':
          description: problem+json; code=not_found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBody'
components:
  schemas:
    GcReportBody:
      type: object
      description: |-
        The `GET /api/self/gc-runs/{runId}` answer: one collection's own
        record of what it did.

        A mirror of `cachet_core::gc::GcReport`, which the worker streams
        verbatim from the bucket rather than re-serializing. The mirror
        exists so the generated document describes the body instead of
        calling it untyped JSON; a unit test decodes the core type's own
        bytes into this one, so the two cannot drift apart quietly.
      required:
      - runId
      - startedAtMs
      - finishedAtMs
      - inventoryPaths
      - activeLeases
      - markedPaths
      - unreadableDeep
      - narinfosDeleted
      - narsDeleted
      - bytesFreed
      - uploadsAborted
      properties:
        activeLeases:
          type: integer
          format: int64
          description: How many leases pinned roots.
          minimum: 0
        bytesFreed:
          type: integer
          format: int64
          description: How many bytes that freed.
          minimum: 0
        finishedAtMs:
          type: integer
          format: int64
          description: When it finished.
          minimum: 0
        gate:
          type:
          - string
          - 'null'
          description: Which gate stopped the run, absent on a run that finished.
        inventoryPaths:
          type: integer
          format: int64
          description: How many paths the inventory held.
          minimum: 0
        markedPaths:
          type: integer
          format: int64
          description: How many paths the mark phase reached.
          minimum: 0
        narinfosDeleted:
          type: integer
          format: int64
          description: How many narinfos the sweep deleted.
          minimum: 0
        narsDeleted:
          type: integer
          format: int64
          description: How many NARs the sweep deleted.
          minimum: 0
        runId:
          type: string
          description: The run's identifier, `{millis}-{16 hex}`.
        startedAtMs:
          type: integer
          format: int64
          description: When the run started.
          minimum: 0
        unreadableDeep:
          type: integer
          format: int64
          description: How many narinfos the walk could not read.
          minimum: 0
        uploadsAborted:
          type: integer
          format: int64
          description: How many abandoned uploads it reaped.
          minimum: 0
    GcRunList:
      type: object
      description: '`GET /api/self/gc-runs`: one page of run ids, oldest first.'
      required:
      - runs
      properties:
        nextCursor:
          type:
          - string
          - 'null'
          description: The cursor for the next page, when more runs exist.
        runs:
          type: array
          items:
            type: string
          description: The run ids in chronological order.
    LeaseBody:
      type: object
      description: |-
        The `GET /roots/{project}` answer: one lease and what it pins.

        A mirror of `cachet_core::lease::LeaseDocument`, served verbatim from
        the bucket for the same reason and held in step by the same test.
      required:
      - project
      - renewedAtMs
      - repository
      - ref
      - runId
      - commitSha
      - installables
      - storePaths
      properties:
        commitSha:
          type: string
          description: The commit it built.
        installables:
          type: array
          items:
            type: string
          description: What the run asked for.
        project:
          type: string
          description: 'The lease name: the repository with its slash hyphenated.'
        ref:
          type: string
          description: The ref that run was on.
        renewedAtMs:
          type: integer
          format: int64
          description: When the lease was last renewed.
          minimum: 0
        repository:
          type: string
          description: '`owner/repo` of the run that renewed it.'
        runId:
          type: string
          description: That run's id.
        storePaths:
          type: array
          items:
            type: string
          description: The store paths the lease pins.
    LoginExchangeBody:
      type: object
      description: |-
        The `POST /api/login/exchange` body: what GitHub handed the CLI
        alongside the access token. Both are optional because an OAuth App
        that has not opted into expiring tokens issues neither, and its
        access token then needs no renewing.
      properties:
        expiresInSeconds:
          type: integer
          format: int64
          description: Seconds the access token lasts, zero when it does not expire.
          minimum: 0
        refreshToken:
          type: string
          description: |-
            The refresh token, so the deployment can renew without the
            person logging in again.
    ProbeAnswer:
      type: object
      description: |-
        The `POST /api/probe` answer: the hashes with a narinfo stored,
        ascending. A narinfo present implies its NAR (never-dangle), so one
        list is the whole answer.
      required:
      - present
      properties:
        present:
          type: array
          items:
            type: string
          description: The hashes the bucket holds, sorted.
    ProbeBody:
      type: object
      description: |-
        The `POST /api/probe` body: the store-path hashes one run asks about,
        as 32-character nix base32. One authorized answer per run replaces
        per-path narinfo HEADs.
      required:
      - paths
      properties:
        paths:
          type: array
          items:
            type: string
          description: The store-path hash halves, without names or the store directory.
    ProblemBody:
      type: object
      description: |-
        The RFC 9457 problem document every non-2xx answer carries. Described
        here rather than serialized from it: the worker emits cachet-core's
        problem writer, whose byte shape is golden-locked, and this type is
        the document's schema for readers.
      required:
      - type
      - status
      - title
      - code
      properties:
        code:
          type: string
          description: cachet's stable machine code, from the error-code table.
        status:
          type: integer
          format: int32
          description: The HTTP status, repeated in the body.
          minimum: 0
        title:
          type: string
          description: The code in words.
        type:
          type: string
          description: Always `about:blank`.
    ProjectList:
      type: object
      description: 'The `GET /roots` body: the projects currently holding leases.'
      required:
      - projects
      properties:
        projects:
          type: array
          items:
            type: string
          description: The hyphenated `owner-repo` project names.
    PublicConfig:
      type: object
      description: |-
        The `GET /api/public/config` body: everything a client needs to reach
        the deployment's auth and verify its signatures, none of it secret.
      required:
      - oauthClientId
      - orgs
      - host
      - publicKey
      properties:
        host:
          type: string
          description: |-
            The deployment's host name, which is also its signing-key name
            prefix.
        oauthClientId:
          type: string
          description: 'The GitHub OAuth App''s client id: a public value.'
        orgs:
          type: array
          items:
            type: string
          description: The GitHub orgs this deployment serves.
        publicKey:
          type: string
          description: The deployment's ed25519 public key in nix's `name:base64` form.
    ReadTokenIssued:
      type: object
      description: |-
        The answer to a read-credential exchange: the token the caller keeps,
        who it speaks for, and when it stops working.
      required:
      - token
      - login
      - expiresAtMs
      properties:
        expiresAtMs:
          type: integer
          format: int64
          description: When it stops being accepted, epoch milliseconds.
          minimum: 0
        login:
          type: string
          description: The GitHub login it speaks for.
        token:
          type: string
          description: The credential. Shown once; the deployment stores only its hash.
    RenewalBody:
      type: object
      description: |-
        The `POST /roots/{project}` body: the store paths a project keeps
        alive plus the installables that produced them.
      required:
      - installables
      - storePaths
      properties:
        installables:
          type: array
          items:
            type: string
          description: The flake installables the job built.
        storePaths:
          type: array
          items:
            type: string
          description: Full nix store paths whose closures must stay alive.
    StatsBody:
      type: object
      description: |-
        `GET /api/self/stats`: the cache's current shape, derived from the
        newest completed report rather than recomputed live.
      required:
      - basedOnRunId
      - inventoryPaths
      - narinfosDeleted
      - narsDeleted
      - bytesFreed
      - finishedAtMs
      properties:
        basedOnRunId:
          type: string
          description: The run the numbers came from.
        bytesFreed:
          type: integer
          format: int64
          description: Bytes the sweep freed.
          minimum: 0
        finishedAtMs:
          type: integer
          format: int64
          description: When that run finished.
          minimum: 0
        gate:
          type:
          - string
          - 'null'
          description: The gate the run aborted on, when one tripped.
        inventoryPaths:
          type: integer
          format: int64
          description: Narinfos in the bucket at that run's inventory.
          minimum: 0
        narinfosDeleted:
          type: integer
          format: int64
          description: Narinfos its sweep deleted.
          minimum: 0
        narsDeleted:
          type: integer
          format: int64
          description: NAR objects its sweep deleted.
          minimum: 0
    StatsEvents:
      type: object
      description: 'The `GET /api/self/events` answer: what the chosen question totalled.'
      required:
      - subject
      - dimension
      - window
      - filters
      - rows
      properties:
        dimension:
          type: string
          description: What it was grouped by.
        filters:
          $ref: '#/components/schemas/StatsFilters'
          description: What the answer was narrowed to.
        rows:
          type: array
          items:
            $ref: '#/components/schemas/StatsRow'
          description: |-
            The rows. A dimension list reads largest first; a series reads
            oldest first and carries one row per bucket, zeros included.
        subject:
          type: string
          description: 'What was counted: `reads`, `writes`, or `probes`.'
        window:
          type: string
          description: How far back the answer looks.
    StatsFilters:
      type: object
      description: |-
        What a counter answer was narrowed to, echoed back so a caller can
        tell a filtered answer from an unfiltered one without re-reading the
        query string it sent.
      properties:
        actor:
          type:
          - string
          - 'null'
          description: Only this caller class, when one was chosen.
        kind:
          type:
          - string
          - 'null'
          description: Only this kind of thing, when one was chosen.
        outcome:
          type:
          - string
          - 'null'
          description: Only this outcome, when one was chosen.
    StatsRow:
      type: object
      description: 'One row of a counter answer: a dimension''s value and its totals.'
      required:
      - dimension
      - count
      - bytes
      properties:
        bytes:
          type: number
          format: double
          description: Bytes, where the answer is bytes.
        count:
          type: number
          format: double
          description: How many things it counts, sample-corrected.
        dimension:
          type: string
          description: |-
            The grouped value, empty where the dimension did not apply.

            For `by=hour` and `by=day` this is the bucket's first instant in
            epoch seconds, written as digits, so a reader never has to agree
            with the SQL engine about a date format.
    UploadCreated:
      type: object
      description: |-
        The `POST /nar/{key}?uploads` body: the new upload's bearer id and the
        part plan the declaration bound.
      required:
      - uploadId
      - expectedParts
      properties:
        expectedParts:
          type: integer
          format: int64
          description: How many parts the declared total implies.
          minimum: 0
        uploadId:
          type: string
          description: 'The upload id: a bearer token naming one in-flight upload.'
    UploadedPartBody:
      type: object
      description: |-
        The `PUT /nar/{key}?uploadId&partNumber` body: the stored part's
        coordinates, which the completion body echoes back.
      required:
      - partNumber
      - etag
      properties:
        etag:
          type: string
          description: The storage layer's part etag.
        partNumber:
          type: integer
          format: int32
          description: The one-based part number just stored.
          minimum: 0
    WhoAmI:
      type: object
      description: 'The `GET /api/whoami` answer: who the caller is to this deployment.'
      required:
      - login
      - admin
      - credential
      properties:
        admin:
          type: boolean
          description: Whether that login is in `CACHET_ADMINS`.
        credential:
          type: string
          description: 'Which credential answered: `browser`, `laptop`, or `ci`.'
        expiresAtMs:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            When a browser session stops being accepted. Absent for the other
            two, whose lifetimes belong to GitHub and to the issued token's
            own record rather than to anything this answer knows.
          minimum: 0
        login:
          type: string
          description: The GitHub login the credential resolved to.
