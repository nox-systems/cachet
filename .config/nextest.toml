# Run discipline: a flake is a determinism bug to root-cause. Retries stay
# zero; a retry is a signal, not a fix.
[profile.default]
fail-fast = false

[profile.ci]
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 3 }
final-status-level = "slow"

[profile.ci.junit]
path = "junit.xml"
