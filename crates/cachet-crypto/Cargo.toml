[package]
name = "cachet-crypto"
description = "Pure crypto for cachet: SHA-256, nix base32 and base64, ed25519 signing of narinfo fingerprints, ruzstd decoding, and RS256 verification. Wasm-clean by construction."
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
cachet-core = { path = "../cachet-core" }
serde.workspace = true
serde_json.workspace = true
# why: SHA-256 over uploaded NAR bytes and stored objects; pure Rust, wasm-clean.
# The `oid` feature wires digest OIDs for rsa's Pkcs1v15Sign::new::<Sha256>.
sha2 = { version = "0.10", features = ["oid"] }
# why: narinfo signature verification and signing; pure Rust, deterministic
# signatures, no rng on the sign path.
ed25519-dalek = { version = "3", default-features = false, features = ["alloc", "digest"] }
# why: secret material is zeroized on drop where we hold it.
zeroize = { version = "1", features = ["zeroize_derive"] }
# why: pure-Rust zstd DECODER; the C crate does not build for wasm32.
ruzstd = "0.7"
# why: base64 for key blobs and Sig values; base64url for JWKS integers.
base64 = "0.22"
# why: RS256 verification of GitHub OIDC JWTs; pure Rust, wasm-clean
# alternative to (banned) ring.
rsa = "0.9"
# why: JWKS n/e arrive base64url without padding.
base64ct = { version = "1", features = ["alloc"] }

[dev-dependencies]
hegeltest.workspace = true
insta.workspace = true
# why: fixture vectors arrive as hex strings.
hex = "0.4"
