# One job per gate, job id equal to gate name (scripts/check-lane-manifest.sh
# pins the lane half of this contract). Local parity is structural: CI runs
# `nix develop --command just <gate>`, the same verb a laptop runs.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  # The cachet action mints its read/write credential from the job's OIDC
  # token; jobs without the grant build uncached, by the action's design.
  id-token: write

jobs:
  # The dependency build, once, before anything that needs it.
  #
  # why: its own job. Every lane restores this derivation's target
  # directory, and the lanes all start at once, so none of them can
  # substitute it from the cache: on any change to Cargo.toml or
  # Cargo.lock every lane built the same 278 crates in parallel and one
  # of them won the race to publish the result. Building it here and
  # letting the lanes wait costs one job's latency and saves the rest of
  # that work. On a run that touches neither file this job substitutes
  # and finishes in seconds.
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: nix on the cachet cache
        uses: nox-systems/cachet/action@v0
        with:
          cache-url: https://cachet.nox.so
          roots: .#devShells.x86_64-linux.default
      - run: nix build -L '.#packages.x86_64-linux.deps'

  fmt:
    needs: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: nix on the cachet cache
        uses: nox-systems/cachet/action@v0
        with:
          cache-url: https://cachet.nox.so
          roots: .#devShells.x86_64-linux.default
      - run: nix develop --command just fmt-check

  clippy:
    needs: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: nix on the cachet cache
        uses: nox-systems/cachet/action@v0
        with:
          cache-url: https://cachet.nox.so
          roots: .#devShells.x86_64-linux.default
      - run: nix develop --command just clippy

  unit:
    needs: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: nix on the cachet cache
        uses: nox-systems/cachet/action@v0
        with:
          cache-url: https://cachet.nox.so
          roots: .#devShells.x86_64-linux.default
      - run: nix develop --command just unit

  property:
    needs: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: nix on the cachet cache
        uses: nox-systems/cachet/action@v0
        with:
          cache-url: https://cachet.nox.so
          roots: .#devShells.x86_64-linux.default
      - run: nix develop --command just property

  golden:
    needs: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: nix on the cachet cache
        uses: nox-systems/cachet/action@v0
        with:
          cache-url: https://cachet.nox.so
          roots: .#devShells.x86_64-linux.default
      - run: nix develop --command just golden

  # Impure like deny: kani setup downloads its own toolchain, so this job is
  # a just verb in the dev shell, not a derivation.
  kani:
    needs: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: nix on the cachet cache
        uses: nox-systems/cachet/action@v0
        with:
          cache-url: https://cachet.nox.so
          roots: .#devShells.x86_64-linux.default
      - run: nix develop --command just kani

  doc-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: nix on the cachet cache
        uses: nox-systems/cachet/action@v0
        with:
          cache-url: https://cachet.nox.so
          roots: .#devShells.x86_64-linux.default
      - run: nix develop --command just doc-manifest

  lane-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: nix on the cachet cache
        uses: nox-systems/cachet/action@v0
        with:
          cache-url: https://cachet.nox.so
          roots: .#devShells.x86_64-linux.default
      - run: nix develop --command just lane-manifest

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: nix on the cachet cache
        uses: nox-systems/cachet/action@v0
        with:
          cache-url: https://cachet.nox.so
          roots: .#devShells.x86_64-linux.default
      - run: nix develop --command just actionlint

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: nix on the cachet cache
        uses: nox-systems/cachet/action@v0
        with:
          cache-url: https://cachet.nox.so
          roots: .#devShells.x86_64-linux.default
      - run: nix develop --command just scripts

  # The impure gate: cargo deny fetches the advisory database. A failure here
  # is a triage signal, not necessarily a regression in the change.
  deny:
    needs: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: nix on the cachet cache
        uses: nox-systems/cachet/action@v0
        with:
          cache-url: https://cachet.nox.so
          roots: .#devShells.x86_64-linux.default
      - run: nix develop --command just deny

  # The wasm build proves the deployable target compiles; the hygiene gate
  # scans its artifact.
  wasm:
    needs: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: nix on the cachet cache
        uses: nox-systems/cachet/action@v0
        with:
          cache-url: https://cachet.nox.so
          roots: .#devShells.x86_64-linux.default
      - run: nix develop --command just wasm

  # The hygiene scan needs the bundle, so this job builds before scanning;
  # the duplicated build keeps the two gates independent, and the hygiene
  # job still fails fast on its own.
  wasm-hygiene:
    needs: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: nix on the cachet cache
        uses: nox-systems/cachet/action@v0
        with:
          cache-url: https://cachet.nox.so
          roots: .#devShells.x86_64-linux.default
      - run: nix develop --command just wasm wasm-hygiene

  # The OpenAPI bijection: the committed document against the code that
  # generates it. Regenerate with `just openapi`.
  openapi:
    needs: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: nix on the cachet cache
        uses: nox-systems/cachet/action@v0
        with:
          cache-url: https://cachet.nox.so
          roots: .#devShells.x86_64-linux.default
      - run: nix develop --command just openapi-check

  workerd:
    needs: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: nix on the cachet cache
        uses: nox-systems/cachet/action@v0
        with:
          cache-url: https://cachet.nox.so
          roots: .#devShells.x86_64-linux.default
      - run: nix develop --command just workerd
