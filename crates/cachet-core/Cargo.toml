[package]
name = "cachet-core"
description = "Pure domain logic for the cachet nix binary cache: narinfo grammar, key validation, leases, GC planning, and the error taxonomy. No I/O, no clock, no entropy."
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
# why: session ids and OAuth states format as base64url; hand-rolling the
# alphabet would duplicate what the worker already brings for JWTs and HTTP
# Basic, for zero behavior gain.
base64ct = { version = "1", features = ["alloc"] }

[dev-dependencies]
hegeltest.workspace = true
insta.workspace = true
