# Deploys. Staging follows every green ci run on main; production is manual
# behind the GitHub environment's reviewer gate. Both stages read their
# configuration from environment-scoped vars and secrets (same names as
# infra/.env.<stage> locally), never from repository-level config, so the
# two stages can diverge safely.
name: deploy

on:
  workflow_run:
    workflows: [ci]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      stage:
        description: The stage to deploy
        required: true
        type: choice
        options:
          - cachet-staging
          - production
        default: cachet-staging

concurrency:
  # why: one deploy per stage at a time, and never cancel a deploy in
  # flight; a half-updated stage is worse than a queued one.
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.stage || 'cachet-staging' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    environment: staging
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CACHET_SIGNING_KEY: ${{ secrets.CACHET_SIGNING_KEY }}
      CACHET_OAUTH_CLIENT_SECRET: ${{ secrets.CACHET_OAUTH_CLIENT_SECRET }}
      CACHET_DEPLOY_HOST: ${{ vars.CACHET_DEPLOY_HOST }}
      CACHET_DEPLOY_ORGS: ${{ vars.CACHET_DEPLOY_ORGS }}
      CACHET_DEPLOY_ADMINS: ${{ vars.CACHET_DEPLOY_ADMINS }}
      CACHET_DEPLOY_OAUTH_CLIENT_ID: ${{ vars.CACHET_DEPLOY_OAUTH_CLIENT_ID }}
      CACHET_DEPLOY_AUDIENCE: ${{ vars.CACHET_DEPLOY_AUDIENCE }}
      CACHET_DEPLOY_DEFAULT_BRANCH_REF: ${{ vars.CACHET_DEPLOY_DEFAULT_BRANCH_REF }}
      CACHET_DEPLOY_DOMAIN: ${{ vars.CACHET_DEPLOY_DOMAIN }}
      CACHET_DEPLOY_UI_ORIGIN: ${{ vars.CACHET_DEPLOY_UI_ORIGIN }}
      # why: zeroed grace is a test-rig property (the integration lane
      # sweeps what it seeds), so the workflow says it outright instead of
      # riding a stage-name default in config.
      CACHET_DEPLOY_GC_GRACE_MS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
      - run: nix develop --command just deploy cachet-staging

  # The integration lane answers whether the deploy just made actually
  # works: served truth, the runner's real OIDC, a push, and a verified
  # substitution back (docs/testing/integration.md). The deployment's
  # domain (which defaults to its host) hosts it, because workers.dev
  # URLs are unpredictable across accounts.
  integration:
    needs: [staging, manual]
    if: >-
      always() && (
        (github.event_name == 'workflow_run' && needs.staging.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.stage == 'cachet-staging' && needs.manual.result == 'success')
      )
    environment: staging
    permissions:
      contents: read
      # The lane mints the org's real OIDC token against this repository.
      id-token: write
    runs-on: ubuntu-latest
    env:
      CACHET_INTEGRATION_URL: https://${{ vars.CACHET_DEPLOY_DOMAIN || vars.CACHET_DEPLOY_HOST }}
      CACHET_INTEGRATION_AUDIENCE: ${{ vars.CACHET_DEPLOY_AUDIENCE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
      - run: nix develop --command just integration

  manual:
    if: github.event_name == 'workflow_dispatch'
    # why: the environment is named for its slot (staging), not its
    # deployment (cachet-staging); the rig owns exactly one environment.
    environment: ${{ inputs.stage == 'cachet-staging' && 'staging' || inputs.stage }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CACHET_SIGNING_KEY: ${{ secrets.CACHET_SIGNING_KEY }}
      CACHET_OAUTH_CLIENT_SECRET: ${{ secrets.CACHET_OAUTH_CLIENT_SECRET }}
      CACHET_DEPLOY_HOST: ${{ vars.CACHET_DEPLOY_HOST }}
      CACHET_DEPLOY_ORGS: ${{ vars.CACHET_DEPLOY_ORGS }}
      CACHET_DEPLOY_ADMINS: ${{ vars.CACHET_DEPLOY_ADMINS }}
      CACHET_DEPLOY_OAUTH_CLIENT_ID: ${{ vars.CACHET_DEPLOY_OAUTH_CLIENT_ID }}
      CACHET_DEPLOY_AUDIENCE: ${{ vars.CACHET_DEPLOY_AUDIENCE }}
      CACHET_DEPLOY_DEFAULT_BRANCH_REF: ${{ vars.CACHET_DEPLOY_DEFAULT_BRANCH_REF }}
      CACHET_DEPLOY_DOMAIN: ${{ vars.CACHET_DEPLOY_DOMAIN }}
      CACHET_DEPLOY_UI_ORIGIN: ${{ vars.CACHET_DEPLOY_UI_ORIGIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
      - run: nix develop --command just deploy ${{ inputs.stage }}
